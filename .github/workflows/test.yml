name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the author-email check needs history, not a shallow tip

      # Five commits once landed as `svh@lxhome.tail556c33.ts.net` — git's
      # username@hostname fallback, used silently when user.email is UNSET.
      # They reached a public repo inside a published tag. A local hook is
      # skippable with --no-verify and does not travel between machines; this
      # does both.
      - name: Commit authorship
        run: |
          authors="sven.herzing@gmail.com 15221068+gerfalcon@users.noreply.github.com"
          committers="$authors noreply@github.com"   # GitHub commits its own merges as noreply
          # On a pull request HEAD is GitHub's synthetic merge commit, committed
          # as noreply@github.com; range to the branch tip instead.
          range="${{ github.event_name == 'pull_request'
                     && format('origin/{0}..{1}', github.base_ref, github.event.pull_request.head.sha)
                     || format('{0}..{1}', github.event.before, github.sha) }}"
          # First push to a branch reports an all-zero "before"; check the tip.
          case "$range" in *0000000000000000000000000000000000000000*) range="HEAD~1..HEAD" ;; esac
          # A merge GitHub made for a pull request (two parents, committed as
          # noreply@github.com) is skipped: its parents were checked on the PR.
          bad=$(git log --format='%H %ae %ce %P' "$range" 2>/dev/null \
                | awk -v au="$authors" -v co="$committers" '
                    BEGIN { n = split(au, a, " "); for (i = 1; i <= n; i++) A[a[i]] = 1
                            n = split(co, c, " "); for (i = 1; i <= n; i++) C[c[i]] = 1 }
                    $3 == "noreply@github.com" && NF >= 5 { next }
                    !($2 in A) || !($3 in C)')
          if [ -n "$bad" ]; then
            echo "commits with an unapproved author or committer email:"
            echo "$bad"
            echo
            echo "allowed authors:    $authors"
            echo "allowed committers: $committers"
            echo "if it looks like user@hostname, user.email was unset on that machine."
            echo "prevent it everywhere: git config --global user.useConfigOnly true"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # A compiled binary once reached the public module zip, carrying the old
      # module path and a service name from its help text in the symbol table.
      # Module zips are immutable and permanently cached, so this has to be
      # caught before the push, not after.
      - name: No committed binaries
        run: |
          found=$(git ls-files | while read -r f; do
            [ -f "$f" ] || continue
            case "$(file --mime-type -b "$f")" in
              application/x-executable|application/x-mach-binary|application/x-sharedlib)
                echo "$f" ;;
            esac
          done)
          if [ -n "$found" ]; then
            echo "compiled binaries are tracked — they end up in the module zip forever:"
            echo "$found"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -race matters here: the store takes concurrent appends and a corrupt
      # JSONL line is silent data loss rather than a crash.
      - name: Test
        run: go test -race -count=1 ./...

      # The cmd/* tests drive the real binaries as child processes, so plain
      # `go test -cover` reports 0% for them — the work happens out of process.
      # GOCOVERDIR makes cmdtest build with -cover and collect the child
      # counters; without it the headline number understates by ~3,000
      # statements and looks like the CLIs are untested.
      - name: Coverage
        run: |
          mkdir -p /tmp/covd
          GOCOVERDIR=/tmp/covd go test -count=1 ./... >/dev/null
          echo "--- end-to-end (binaries) ---"
          go tool covdata percent -i=/tmp/covd
          echo "--- in-process (libraries) ---"
          go test -count=1 -coverprofile=cover.out ./internal/... ./pkg/... >/dev/null
          go tool cover -func=cover.out | tail -1

      # The tool holds its own line, or it has no standing to hold anyone
      # else's. Step 4 of the release checklist in rules/MAINTAINING.md.
      - name: Ratchet holds its own baseline
        run: |
          go run ./cmd/ratchet scan .
          go run ./cmd/ratchet check .

      - name: Codebase obeys its own declared architecture
        run: go run ./cmd/plumb check .

      # Tightening is free; loosening the declaration needs a second reviewer.
      - name: Classify architecture declaration changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          go run ./cmd/plumb diff . --base "origin/${{ github.base_ref }}"
